name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # After the build, so Next's generated route types exist.
      - run: npx tsc --noEmit

      - name: Check the registry
        run: |
          npx next start -p 3000 &
          for i in $(seq 30); do curl -sf http://localhost:3000/r/registry.json > /dev/null && break; sleep 2; done
          node scripts/check-registry.mjs http://localhost:3000
